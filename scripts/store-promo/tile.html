<!doctype html>
<!--
  Chrome Web Store promo tiles. Render with:
    pnpm store-promo
  Pick a size with ?size=small (440x280) or ?size=marquee (1400x560).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; }
  body {
    font-family: 'DM Sans', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #000;
  }

  /* Every length is in --u so both sizes share one layout */
  .tile {
    --bg: #f5f0e6; --blob-a: #f8cc65; --blob-b: #c4d8dc; --accent: #1f6b70;
    position: relative;
    isolation: isolate;
    width: calc(440 * var(--u));
    height: calc(280 * var(--u));
    overflow: hidden;
    background: var(--bg);
  }
  .tile--small   { --u: 1px; }
  .tile--marquee { --u: 2px; width: 1400px; height: 560px; }

  .tile::before,
  .tile::after {
    content: "";
    position: absolute;
    z-index: -2;
    border-radius: 50%;
  }
  .tile::before { right: calc(-70 * var(--u)); bottom: calc(-118 * var(--u)); width: calc(190 * var(--u)); height: calc(190 * var(--u)); background: var(--blob-a); }
  .tile::after  { right: calc(-60 * var(--u)); top: calc(-90 * var(--u)); width: calc(200 * var(--u)); height: calc(200 * var(--u)); background: var(--blob-b); }

  .copy {
    position: absolute;
    left: calc(28 * var(--u));
    top: calc(26 * var(--u));
  }

  .brand {
    display: flex;
    align-items: center;
    gap: calc(7 * var(--u));
    font-size: calc(15 * var(--u));
    font-weight: 700;
    letter-spacing: -.3px;
  }
  .brand svg { width: calc(22 * var(--u)); height: calc(22 * var(--u)); }

  h1 {
    margin-top: calc(18 * var(--u));
    font-size: calc(38 * var(--u));
    font-weight: 700;
    line-height: 1;
    letter-spacing: calc(-1.4 * var(--u));
  }
  h1 span {
    display: inline;
    margin-left: calc(7 * var(--u));
    font-size: calc(27 * var(--u));
    font-weight: 600;
    letter-spacing: calc(-.6 * var(--u));
    color: var(--accent);
  }

  .pills {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: calc(5 * var(--u));
    margin-top: calc(18 * var(--u));
    list-style: none;
  }
  .pills li {
    display: inline-flex;
    align-items: center;
    gap: calc(8 * var(--u));
    font-size: calc(15.5 * var(--u));
    font-weight: 600;
    color: #1d1c1a;
  }
  .pills svg { width: calc(15 * var(--u)); height: calc(15 * var(--u)); color: var(--accent); flex: none; }

  /* Marquee: copy on the left, a larger rendered-document card on the right */
  .tile--marquee .copy { left: 96px; top: 50%; transform: translateY(-50%); }
  .tile--marquee .brand { font-size: 26px; gap: 12px; }
  .tile--marquee .brand svg { width: 40px; height: 40px; }
  .tile--marquee h1 { margin-top: 24px; font-size: 76px; letter-spacing: -2.8px; }
  .tile--marquee h1 span { margin-left: 16px; font-size: 58px; letter-spacing: -1.2px; }
  .tile--marquee .pills { gap: 14px; margin-top: 38px; }
  .tile--marquee .pills li { font-size: 36px; gap: 16px; }
  .tile--marquee::before { right: -40px; bottom: -240px; width: 520px; height: 520px; }
  .tile--marquee::after { right: -120px; top: -200px; width: 460px; height: 460px; }

  .doc { display: none; }
  .tile--marquee .doc {
    display: block;
    position: absolute;
    right: 60px;
    top: 70px;
    width: 380px;
    height: 430px;
    padding: 36px 34px;
    background: #fff;
    border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
    border-radius: 18px;
    box-shadow: 0 26px 56px color-mix(in srgb, var(--accent) 20%, transparent), 0 4px 12px rgba(88, 42, 20, .1);
    transform: rotate(1.5deg);
  }
  .doc .bar { height: 12px; border-radius: 6px; background: #e4ded2; margin-bottom: 16px; }
  .doc .bar--title { width: 62%; height: 22px; background: #1d1c1a; margin-bottom: 26px; }
  .doc .bar--hl { background: color-mix(in srgb, var(--blob-a) 70%, #fff); }
  .doc .bar--short { width: 70%; }
  .doc .bar--h2 { width: 40%; height: 16px; background: #6b665c; margin-top: 30px; }
  .doc .comment {
    position: absolute;
    left: -40px;
    bottom: 40px;
    width: 230px;
    padding: 16px 18px;
    background: #fff;
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    border-radius: 14px;
    box-shadow: 0 14px 30px color-mix(in srgb, var(--accent) 22%, transparent);
    transform: rotate(-3deg);
  }
  .doc .comment .bar { margin-bottom: 10px; height: 10px; }
  .doc .comment .who { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .doc .comment .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); }
  .doc .comment .who .bar { width: 50%; margin: 0; background: #b9b2a4; }
</style>
</head>
<body>

<template id="logo">
  <svg viewBox="0 0 128 128" aria-hidden="true">
    <rect width="128" height="128" rx="28" fill="#18181b"/>
    <path d="M22 92 V 28 h12 l26 38 26 -38 h12 V 92 h-12 V 50 l-22 32 h-8 L34 50 V 92 Z" fill="#fff"/>
    <g stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M90 108 H118"/>
      <path d="M109 99 L118 108 L109 117"/>
    </g>
  </svg>
</template>

<template id="check">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
</template>

<section class="tile" id="tile">
  <div class="copy">
    <div class="brand" data-logo>Markside</div>
    <h1>Markdown Viewer<br />&amp; Editor<span>for your local files</span></h1>
    <ul class="pills">
      <li data-check>Review with teammates or AI agents</li>
      <li data-check>Free, open source, privacy-first</li>
      <li data-check>GitHub-style, Mermaid, math, printable</li>
    </ul>
  </div>
  <div class="doc" aria-hidden="true">
    <div class="bar bar--title"></div>
    <div class="bar"></div>
    <div class="bar bar--hl"></div>
    <div class="bar bar--short"></div>
    <div class="bar bar--h2"></div>
    <div class="bar"></div>
    <div class="bar bar--short"></div>
    <div class="bar"></div>
    <div class="bar bar--hl" style="width: 55%"></div>
    <div class="comment">
      <div class="who"><div class="dot"></div><div class="bar"></div></div>
      <div class="bar"></div>
      <div class="bar" style="width: 65%"></div>
    </div>
  </div>
</section>

<script>
  const size = new URLSearchParams(location.search).get('size') === 'marquee' ? 'marquee' : 'small'
  document.getElementById('tile').classList.add(`tile--${size}`)
  const logo = document.getElementById('logo').content
  const check = document.getElementById('check').content
  document.querySelectorAll('[data-logo]').forEach((el) => el.prepend(logo.cloneNode(true)))
  document.querySelectorAll('[data-check]').forEach((el) => el.prepend(check.cloneNode(true)))
</script>
</body>
</html>
