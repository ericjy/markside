<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a language model picks the next word</title>
<style>
  :root { color-scheme: dark; --bg: #0b0f17; --panel: #111722; --line: #1e2633; --ink: #e6e9ef; --muted: #8a94a6; --accent: #7c9cff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { padding: 18px; color: var(--ink); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .eyebrow { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin-bottom: 8px; }

  .sentence {
    min-height: 92px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
    font-size: 22px; line-height: 1.45; letter-spacing: -0.01em; margin-bottom: 16px;
  }
  .prompt { color: #9aa4b6; }
  .token { color: #fff; border-radius: 5px; }
  .token.fresh { animation: fresh 1.4s ease-out; }
  @keyframes fresh { 0% { background: color-mix(in srgb, var(--c) 45%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 45%, transparent); } 100% { background: transparent; box-shadow: 0 0 0 3px transparent; } }
  .caret { display: inline-block; width: 2px; height: 1.05em; margin-left: 3px; vertical-align: -0.15em; background: var(--accent); animation: blink 1s steps(1) infinite; }
  .finished .caret { opacity: 0; animation: none; }
  @keyframes blink { 50% { opacity: 0; } }

  .rows { display: grid; gap: 6px; min-height: calc(8 * 28px + 7 * 6px); align-content: start; position: relative; }
  .row {
    display: grid; grid-template-columns: 116px minmax(0, 1fr) 48px; align-items: center; gap: 12px; height: 28px;
    padding: 0 8px 0 4px; border-radius: 8px; transition: background .15s;
    animation: enter .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 45ms);
  }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } }
  .row.hot { background: color-mix(in srgb, var(--c) 14%, transparent); }
  .row.chosen { background: color-mix(in srgb, var(--c) 24%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 70%, transparent); }
  .chip {
    justify-self: start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 3px 9px; border-radius: 6px; font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
  }
  .track { height: 10px; border-radius: 99px; background: #1a2130; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 99px; background: var(--c); box-shadow: 0 0 12px -2px var(--c); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
  .pct { text-align: right; font-variant-numeric: tabular-nums; color: #c8cfdb; font-weight: 600; }
  .end { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--muted); gap: 6px; animation: enter .4s both; }
  .end b { color: var(--ink); font-size: 15px; }
  .picks { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; max-width: 640px; margin: 10px auto 4px; }
  .pick { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 9px; border-radius: 8px; background: color-mix(in srgb, var(--c) 14%, transparent); animation: enter .4s both; animation-delay: calc(var(--i) * 70ms); }
  .pick b { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--c); }
  .pick span { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .times { color: #4b5566; font-size: 12px; }
  .odds { color: var(--ink); font-size: 13.5px; }
  .odds b { font-size: 18px; color: #fff; }

  .strip-wrap { position: relative; margin: 18px 0 6px; }
  .strip { display: flex; gap: 2px; height: 30px; border-radius: 8px; overflow: hidden; }
  .seg {
    min-width: 0; display: grid; place-items: center; overflow: hidden; white-space: nowrap;
    background: color-mix(in srgb, var(--c) 55%, #0b0f17); color: #0b0f17; font: 700 11.5px ui-monospace, SFMono-Regular, Menlo, monospace;
    transition: flex-basis .5s cubic-bezier(.2, .8, .2, 1), background .15s;
  }
  .seg.hot { background: var(--c); }
  .needle { position: absolute; top: -7px; bottom: -4px; width: 0; left: 0; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .needle.show { opacity: 1; }
  .needle::before { content: ""; position: absolute; left: -1px; top: 4px; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 10px #fff; }
  .needle::after { content: ""; position: absolute; left: -6px; top: 0; border: 6px solid transparent; border-top: 7px solid #fff; }
  .roll { min-height: 18px; color: var(--muted); font-size: 12px; }
  .roll b { color: var(--ink); }

  .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .buttons { display: flex; gap: 8px; }
  button { font: inherit; color: var(--ink); background: #182030; border: 1px solid #263043; border-radius: 8px; padding: 6px 13px; cursor: pointer; transition: background .15s, transform .1s; }
  button:hover:not(:disabled) { background: #1f293b; }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: transparent; color: #0b0f17; font-weight: 650; }
  button.primary:hover:not(:disabled) { background: #95b0ff; }
  button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 22%, #182030); border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .temp { display: grid; grid-template-columns: auto 160px auto; align-items: center; gap: 4px 12px; }
  .temp label { font-weight: 600; }
  .temp input { width: 100%; accent-color: var(--accent); margin: 0; }
  .temp output { font-variant-numeric: tabular-nums; min-width: 150px; color: var(--muted); }
  .temp output b { color: var(--ink); }
  .formula { grid-column: 2 / 4; color: var(--muted); font-size: 11.5px; }
  .ghost { position: fixed; z-index: 5; margin: 0; pointer-events: none; transform-origin: left center; }
  @media (prefers-reduced-motion: reduce) { .row, .end { animation: none; } .fill, .seg { transition: none; } }
</style>
</head>
<body>
<div class="eyebrow">Text so far</div>
<div class="sentence" id="sentence"><span class="prompt">The cat sat on the</span><span id="generated"></span><span class="caret" id="caret"></span></div>

<div class="eyebrow">What the model thinks comes next</div>
<div class="rows" id="rows"></div>

<div class="strip-wrap">
  <div class="strip" id="strip"></div>
  <div class="needle" id="needle"></div>
</div>
<div class="roll" id="roll">The model rolls a random number between 0 and 1 and takes the word it lands on.</div>

<div class="controls">
  <div class="buttons">
    <button class="primary" id="next" type="button">Next word</button>
    <button id="auto" type="button" aria-pressed="false">Auto</button>
    <button id="restart" type="button">Restart</button>
  </div>
  <div class="temp">
    <label for="temperature">Temperature</label>
    <input id="temperature" type="range" min="0" max="2" step="0.05" value="0.8">
    <output id="temperature-value" for="temperature"></output>
    <div class="formula mono">probability ∝ e^(score ÷ temperature)</div>
  </div>
</div>

<script>
(() => {
  // A tiny hand-written "model": each state lists candidate words, their raw
  // scores (logits), and the state that follows.
  const model = {
    start: [["mat", 3.1, "P"], ["windowsill", 2.3, "P"], ["couch", 2.2, "P"], ["keyboard", 1.9, "P"], ["laptop", 1.6, "P"], ["roof", 1.2, "P"], ["moon", -0.6, "P"], ["banana", -1.4, "P"]],
    P: [["and", 2.3, "V"], ["while", 1.9, "W"], [".", 1.5, "END"], ["purring", 1.4, "M"], ["quietly", 0.8, "M"], ["again", 0.5, "M"], ["!", -0.2, "END"]],
    V: [["purred", 2.2, "M"], ["yawned", 1.8, "M"], ["fell", 1.6, "FELL"], ["stared", 1.5, "AT"], ["ignored", 1.1, "IG"], ["sneezed", 0.4, "M"]],
    FELL: [["asleep", 3.0, "M"], ["off", 1.7, "OFF"], ["over", 0.6, "OFF"]],
    OFF: [[".", 2.6, "END"], ["!", 1.2, "END"]],
    AT: [["at", 3.2, "ATW"], ["into", 1.2, "SPACE"], ["outside", 0.9, "M"]],
    SPACE: [["space", 2.5, "M"], ["nothing", 1.2, "M"]],
    ATW: [["the", 2.2, "THE"], ["nothing", 1.5, "M"], ["me", 1.2, "M"], ["us", 0.6, "M"]],
    IG: [["everyone", 2.2, "M"], ["me", 1.8, "M"], ["the", 1.4, "THE"], ["us", 1.0, "M"]],
    THE: [["birds", 2.0, "M"], ["wall", 1.5, "M"], ["dog", 1.4, "M"], ["rain", 1.2, "M"], ["vacuum", 0.7, "M"]],
    W: [["the", 2.0, "WT"], ["I", 1.5, "WI"], ["it", 1.3, "WIT"]],
    WT: [["dog", 2.0, "WTD"], ["rain", 1.8, "WTR"], ["kettle", 0.9, "WTK"]],
    WTD: [["slept", 2.0, "M"], ["barked", 1.7, "M"], ["watched", 1.4, "M"], ["sulked", 0.5, "M"]],
    WTR: [["fell", 1.9, "M"], ["poured", 1.6, "M"], ["pattered", 1.2, "M"]],
    WTK: [["boiled", 2.1, "M"], ["whistled", 1.8, "M"], ["hissed", 0.9, "M"]],
    WI: [["worked", 2.1, "M"], ["typed", 1.6, "M"], ["cooked", 1.5, "M"], ["napped", 0.9, "M"]],
    WIT: [["rained", 2.0, "M"], ["snowed", 1.2, "M"], ["thundered", 0.8, "M"]],
    M: [[".", 2.2, "END"], ["all", 1.5, "DAY"], ["for", 1.4, "FOR"], ["softly", 0.9, "E1"], ["happily", 0.8, "E1"], ["!", 0.2, "END"]],
    DAY: [["day", 2.6, "E1"], ["night", 1.9, "E1"], ["morning", 1.1, "E1"]],
    FOR: [["hours", 2.0, "E1"], ["a", 1.6, "WHILE"], ["ages", 1.3, "E1"], ["days", 0.4, "E1"]],
    WHILE: [["while", 3.0, "E1"], ["bit", 1.6, "E1"]],
    E1: [[".", 3.0, "END"], ["!", 0.9, "END"]],
  }
  const colors = ["#7c9cff", "#3fb950", "#f0883e", "#d2a8ff", "#39c5cf", "#ff7b72", "#e3b341", "#8b949e"]
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, reduceMotion ? Math.min(ms, 120) : ms))

  const sentence = document.getElementById("sentence")
  const generated = document.getElementById("generated")
  const caret = document.getElementById("caret")
  const rowsEl = document.getElementById("rows")
  const strip = document.getElementById("strip")
  const needle = document.getElementById("needle")
  const rollEl = document.getElementById("roll")
  const nextButton = document.getElementById("next")
  const autoButton = document.getElementById("auto")
  const restartButton = document.getElementById("restart")
  const temperature = document.getElementById("temperature")
  const temperatureValue = document.getElementById("temperature-value")

  let state = "start"
  let busy = false
  let auto = false
  let rows = []
  let picks = []
  let segments = []

  function probabilities(options) {
    const t = Number(temperature.value)
    if (t < 0.05) {
      const best = Math.max(...options.map(([, score]) => score))
      return options.map(([, score]) => (score === best ? 1 : 0))
    }
    const weights = options.map(([, score]) => Math.exp(score / t))
    const total = weights.reduce((sum, w) => sum + w, 0)
    return weights.map((w) => w / total)
  }

  const percent = (p) => (p === 0 ? "0%" : p < 0.01 ? "<1%" : `${Math.round(p * 100)}%`)

  function describeTemperature() {
    const t = Number(temperature.value)
    const mood = t < 0.05 ? "always the top word" : t < 0.5 ? "predictable" : t <= 1.2 ? "balanced" : t <= 1.6 ? "adventurous" : "chaotic"
    temperatureValue.innerHTML = `<b>${t.toFixed(2)}</b> · ${mood}`
  }

  function render() {
    rowsEl.replaceChildren()
    strip.replaceChildren()
    needle.classList.remove("show")
    sentence.classList.toggle("finished", state === "END")
    if (state === "END") {
      rows = []
      segments = []
      const odds = picks.reduce((product, pick) => product * pick.p, 1)
      const chips = picks
        .map((pick, i) => `<span class="pick" style="--c:${pick.color};--i:${i}"><b></b><span>${percent(pick.p)}</span></span>`)
        .join('<span class="times">×</span>')
      rowsEl.innerHTML = `<div class="end"><b>Sentence finished</b><span>Each word was one roll of the dice:</span><div class="picks">${chips}</div>
        <span class="odds">Chance of this exact sentence: <b>${odds < 0.001 ? (odds * 100).toPrecision(2) : (odds * 100).toFixed(1)}%</b></span></div>`
      rowsEl.querySelectorAll(".pick b").forEach((b, i) => (b.textContent = picks[i].word))
      rollEl.textContent = ""
      nextButton.textContent = "Start over"
      return
    }
    nextButton.textContent = "Next word"
    const options = model[state]
    rows = options.map(([word], i) => {
      const row = document.createElement("div")
      row.className = "row"
      row.style.setProperty("--c", colors[i])
      row.style.setProperty("--i", i)
      row.innerHTML = `<span class="chip"></span><div class="track"><div class="fill"></div></div><span class="pct"></span>`
      row.querySelector(".chip").textContent = word
      rowsEl.append(row)
      return { row, chip: row.querySelector(".chip"), fill: row.querySelector(".fill"), pct: row.querySelector(".pct") }
    })
    segments = options.map(([word], i) => {
      const seg = document.createElement("div")
      seg.className = "seg"
      seg.style.setProperty("--c", colors[i])
      seg.style.flex = "0 0 0%"
      seg.textContent = word
      strip.append(seg)
      return seg
    })
    requestAnimationFrame(() => requestAnimationFrame(() => updateBars(true)))
  }

  function updateBars(staggered) {
    if (state === "END") return
    const probs = probabilities(model[state])
    const top = Math.max(...probs)
    rows.forEach(({ fill, pct }, i) => {
      fill.style.transitionDelay = staggered ? `${i * 45}ms` : "0ms"
      fill.style.width = `${(probs[i] / top) * 100}%`
      pct.textContent = percent(probs[i])
    })
    segments.forEach((seg, i) => {
      seg.style.flex = `0 0 calc(${probs[i] * 100}% - 2px)`
      seg.style.color = probs[i] > 0.09 ? "" : "transparent"
    })
  }

  function indexAt(probs, position) {
    let sum = 0
    for (let i = 0; i < probs.length; i++) {
      sum += probs[i]
      if (position < sum) return i
    }
    return probs.length - 1
  }

  function highlight(index) {
    rows.forEach(({ row }, i) => row.classList.toggle("hot", i === index))
    segments.forEach((seg, i) => seg.classList.toggle("hot", i === index))
  }

  function roll(probs, target) {
    needle.classList.add("show")
    const duration = reduceMotion ? 0 : 1300
    const laps = 2
    return new Promise((resolve) => {
      const start = performance.now()
      const frame = (now) => {
        const t = duration ? Math.min(1, (now - start) / duration) : 1
        const eased = 1 - (1 - t) ** 4
        const position = ((laps + target) * eased) % 1
        needle.style.left = `${position * 100}%`
        highlight(indexAt(probs, position))
        if (t < 1) requestAnimationFrame(frame)
        else resolve()
      }
      requestAnimationFrame(frame)
    })
  }

  async function fly(chip, word, color) {
    const from = chip.getBoundingClientRect()
    const to = caret.getBoundingClientRect()
    const ghost = chip.cloneNode(true)
    ghost.classList.add("ghost")
    ghost.style.setProperty("--c", color)
    Object.assign(ghost.style, { left: `${from.left}px`, top: `${from.top}px`, width: `${from.width}px` })
    document.body.append(ghost)
    const dx = to.left - from.left + 6
    const dy = to.top + to.height / 2 - (from.top + from.height / 2)
    await ghost.animate(
      [
        { transform: "translate(0, 0) scale(1)", opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) scale(1.55)`, opacity: 0.9, offset: 0.85 },
        { transform: `translate(${dx}px, ${dy}px) scale(1.6)`, opacity: 0 },
      ],
      { duration: reduceMotion ? 1 : 560, easing: "cubic-bezier(.3, .7, .2, 1)" },
    ).finished
    ghost.remove()
  }

  function append(word, color) {
    const glue = /^[.,!?]$/.test(word) ? "" : " "
    const span = document.createElement("span")
    span.className = "token fresh"
    span.style.setProperty("--c", color)
    span.textContent = word
    generated.append(glue, span)
  }

  async function step() {
    if (busy) return
    if (state === "END") {
      restart()
      return
    }
    busy = true
    nextButton.disabled = true
    temperature.disabled = true
    const options = model[state]
    const probs = probabilities(options)
    const target = Math.random()
    const index = indexAt(probs, target)
    const [word, , next] = options[index]
    await roll(probs, target)
    rows[index].row.classList.add("chosen")
    rollEl.innerHTML = `Rolled <b class="mono">${target.toFixed(2)}</b> → landed on <b class="mono">“${word}”</b>, a ${percent(probs[index])} chance.`
    await wait(380)
    await fly(rows[index].chip, word, colors[index])
    append(word, colors[index])
    picks.push({ word, p: probs[index], color: colors[index] })
    state = next
    await wait(120)
    render()
    temperature.disabled = false
    nextButton.disabled = auto
    busy = false
  }

  function restart() {
    state = "start"
    generated.replaceChildren()
    picks = []
    rollEl.textContent = "The model rolls a random number between 0 and 1 and takes the word it lands on."
    render()
  }

  async function runAuto() {
    while (auto) {
      if (state === "END") {
        await wait(2400)
        if (!auto) return
        restart()
        await wait(700)
        continue
      }
      await step()
      await wait(500)
    }
  }

  function setAuto(next) {
    auto = next
    autoButton.setAttribute("aria-pressed", String(auto))
    autoButton.textContent = auto ? "Stop" : "Auto"
    nextButton.disabled = auto || busy
    if (auto) runAuto()
  }

  nextButton.addEventListener("click", step)
  autoButton.addEventListener("click", () => setAuto(!auto))
  restartButton.addEventListener("click", () => {
    if (!busy) restart()
  })
  temperature.addEventListener("input", () => {
    describeTemperature()
    updateBars(false)
  })

  describeTemperature()
  render()
  if (!reduceMotion) {
    let started = false
    new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting && !started) {
        started = true
        setTimeout(() => setAuto(true), 600)
      }
    }, { threshold: 0.4 }).observe(rowsEl)
  }
})()
</script>
</body>
</html>
